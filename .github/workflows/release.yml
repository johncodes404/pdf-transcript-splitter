name: Build Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Build EXE
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --additional-hooks-dir "." --name "成绩单PDF拆分工具"
          --icon "app.ico" --add-data "app.ico;." app.py

      - name: Create GitHub Release and upload EXE
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create "${{ github.ref_name }}"
          "dist/成绩单PDF拆分工具.exe"
          --title "成绩单 PDF 拆分工具 ${{ github.ref_name }}"
          --generate-notes